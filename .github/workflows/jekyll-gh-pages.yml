name: Publish metamodel releases
on:
  push:
    branches: [gh-pages]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 0
      - name: Fetch latest model source
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main --tags
      - run: python3 scripts/assemble_releases.py
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_release_site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5
      - uses: actions/deploy-pages@v5
        id: deployment
